# M3 — optional scheduled workforce intel ETL snapshot (historical feature table).
#
# Secrets (repository):
#   M3_ETL_API_URL  — e.g. https://api.example.com/api/admin/workforce-intel/etl/snapshot
#   M3_ETL_ADMIN_JWT — Bearer token for an admin user

name: M3 Workforce Intel ETL Snapshot

on:
  schedule:
    - cron: "15 6 * * 1" # Weekly Monday 06:15 UTC
  workflow_dispatch:

jobs:
  etl-snapshot:
    runs-on: ubuntu-22.04
    if: ${{ secrets.M3_ETL_API_URL != '' && secrets.M3_ETL_ADMIN_JWT != '' }}
    steps:
      - name: POST ETL snapshot
        env:
          URL: ${{ secrets.M3_ETL_API_URL }}
          TOKEN: ${{ secrets.M3_ETL_ADMIN_JWT }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/m3_etl.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --connect-timeout 20 --max-time 120 \
            "${URL}")"
          echo "HTTP ${code}"
          cat /tmp/m3_etl.json || true
          if [ "${code}" != "200" ]; then
            echo "::error::ETL snapshot failed"
            exit 1
          fi
