name: E2E Playwright

on:
  workflow_dispatch:

jobs:
  hiring-dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: test_database
      JWT_SECRET: ci-jwt-secret-change-me
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_URL: http://127.0.0.1:11001
      PLAYWRIGHT_USER_EMAIL: ci_e2e@example.com
      PLAYWRIGHT_USER_PASSWORD: secret123
      HIRING_SNAPSHOT_TOKEN: ci-hiring-snapshot-token
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply MongoDB migrations
        working-directory: backend
        run: python scripts/mongo_migrate.py up

      - name: Seed QA baseline
        working-directory: backend
        run: python scripts/seed_qa_baseline.py

      - name: Seed hiring dashboard E2E alerts
        working-directory: backend
        run: python scripts/seed_hiring_dashboard_e2e.py

      - name: Seed assessment demo data
        working-directory: backend
        run: python scripts/seed_assessment_submissions_demo.py || echo "Assessment seed warning (non-fatal)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Register E2E user (background API)
        working-directory: backend
        env:
          HIRING_SNAPSHOT_TOKEN: ci-hiring-snapshot-token
        run: |
          python -m uvicorn server:app --host 127.0.0.1 --port 11001 --log-level warning &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:11001/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 0.5
          done
          curl -s -X POST http://127.0.0.1:11001/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${PLAYWRIGHT_USER_EMAIL}\",\"password\":\"${PLAYWRIGHT_USER_PASSWORD}\",\"full_name\":\"E2E User\",\"role\":\"admin\"}" \
            || true
          curl -sS -X POST http://127.0.0.1:11001/api/admin/hiring-dashboard/snapshot-cron \
            -H "X-Hiring-Snapshot-Token: ci-hiring-snapshot-token" \
            -H "Content-Type: application/json" \
            -d '{}' || true
          kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true

      - name: Run Smart Hiring Dashboard E2E
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
