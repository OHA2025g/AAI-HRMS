name: E2E (Playwright)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      - ".github/workflows/e2e-playwright.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ci_e2e_aai_hrms
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:11001
      CI: "true"
      QA_SEED_FORCE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrations + QA seed (admin user)
        working-directory: backend
        run: |
          python scripts/mongo_migrate.py up
          python scripts/seed_qa_baseline.py

      - name: Start API (background)
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 11001 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:11001/api/health && exit 0; sleep 1; done
          echo "API failed to start"; tail -200 /tmp/api.log; exit 1

      - name: Frontend install + build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://127.0.0.1:11001
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Serve frontend (background)
        working-directory: frontend
        run: |
          npx --yes serve@14 -s build -l 3000 > /tmp/fe.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          echo "Frontend failed to start"; tail -200 /tmp/fe.log; exit 1

      - name: Playwright install + test
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
