# M9 — optional scheduled leadership snapshot (no interactive JWT).
#
# Repository secrets:
#   M9_SNAPSHOT_URL   — full URL, e.g. https://api.example.com/api/executive/m9/export-packs/monthly-snapshot-cron
#   M9_SNAPSHOT_TOKEN — must match backend env M9_SNAPSHOT_TOKEN (sent as X-M9-Snapshot-Token)
#
# Optional body for fixed period (otherwise API defaults to previous calendar month UTC):
#   echo '{"period":"2025-02"}' | curl ... -d @-

name: M9 Leadership Snapshot

on:
  schedule:
    # 1st of month 07:00 UTC — adjust as needed
    - cron: "0 7 1 * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-22.04
    if: ${{ secrets.M9_SNAPSHOT_URL != '' && secrets.M9_SNAPSHOT_TOKEN != '' }}
    steps:
      - name: POST monthly-snapshot-cron
        env:
          URL: ${{ secrets.M9_SNAPSHOT_URL }}
          TOKEN: ${{ secrets.M9_SNAPSHOT_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 15 --max-time 180 \
            -o /tmp/m9_body.txt -w "%{http_code}" \
            -X POST \
            -H "X-M9-Snapshot-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${URL}")"
          echo "HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${code}"
            head -c 2000 /tmp/m9_body.txt || true
            exit 1
          fi
          head -c 2000 /tmp/m9_body.txt || true
