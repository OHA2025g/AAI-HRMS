name: Quality Gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: backend
        run: pytest -q tests/test_phase1_unit.py tests/test_migrations_manifest.py tests/test_ranking_regression.py tests/test_m2_lifecycle.py tests/test_m9_analytics.py

      - name: RBAC static audit
        working-directory: backend
        run: python scripts/rbac_audit.py --strict

  # M0-4: apply migrations against real Mongo (lighter than full Phase-1 / uvicorn).
  backend-mongo-migrations:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ci_quality_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations (apply + idempotent re-run)
        working-directory: backend
        run: |
          python scripts/mongo_migrate.py up
          python scripts/mongo_migrate.py status
          python scripts/mongo_migrate.py up

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build
