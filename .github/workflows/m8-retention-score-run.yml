# M8 — optional scheduled attrition score batch (no interactive JWT).
#
# Repository secrets:
#   M8_SCORE_RUN_URL   — full URL, e.g. https://api.example.com/api/workforce/retention/v1/score-run-cron
#   M8_SCORE_RUN_TOKEN — must match backend env M8_SCORE_RUN_TOKEN (sent as X-M8-Score-Token)

name: M8 Retention Score Run

on:
  schedule:
    # Daily 06:15 UTC — adjust as needed
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  score-run:
    runs-on: ubuntu-22.04
    if: ${{ secrets.M8_SCORE_RUN_URL != '' && secrets.M8_SCORE_RUN_TOKEN != '' }}
    steps:
      - name: POST score-run-cron
        env:
          URL: ${{ secrets.M8_SCORE_RUN_URL }}
          TOKEN: ${{ secrets.M8_SCORE_RUN_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS --connect-timeout 15 --max-time 120 \
            -o /tmp/m8_body.txt -w "%{http_code}" \
            -X POST \
            -H "X-M8-Score-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${URL}")"
          echo "HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${code}"
            head -c 2000 /tmp/m8_body.txt || true
            exit 1
          fi
