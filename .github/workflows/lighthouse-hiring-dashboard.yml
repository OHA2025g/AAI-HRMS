name: Lighthouse — Hiring Dashboard a11y

on:
  workflow_dispatch:

jobs:
  lighthouse-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: test_database
      JWT_SECRET: ci-jwt-secret-change-me
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_URL: http://127.0.0.1:11001
      PLAYWRIGHT_USER_EMAIL: ci_lighthouse@example.com
      PLAYWRIGHT_USER_PASSWORD: secret123
      HIRING_SNAPSHOT_TOKEN: ci-hiring-snapshot-token
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply MongoDB migrations
        working-directory: backend
        run: python scripts/mongo_migrate.py up

      - name: Seed QA baseline
        working-directory: backend
        run: python scripts/seed_qa_baseline.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start API and frontend
        run: |
          cd backend
          python -m uvicorn server:app --host 127.0.0.1 --port 11001 --log-level warning &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:11001/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 0.5
          done
          curl -s -X POST http://127.0.0.1:11001/api/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${PLAYWRIGHT_USER_EMAIL}\",\"password\":\"${PLAYWRIGHT_USER_PASSWORD}\",\"full_name\":\"Lighthouse User\",\"role\":\"admin\"}" \
            || true
          cd ../frontend
          BROWSER=none npm start &
          echo $! > /tmp/frontend.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done

      - name: Run Lighthouse CI (accessibility ≥ 90)
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.cjs

      - name: Stop background servers
        if: always()
        run: |
          kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
          kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
