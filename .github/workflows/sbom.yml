name: SBOM (CycloneDX)

on:
  pull_request:
  push:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CycloneDX Python tool
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom

      - name: Generate backend SBOM from requirements.txt
        run: |
          mkdir -p sbom-artifacts
          python -m cyclonedx_py requirements backend/requirements.txt \
            -o sbom-artifacts/sbom-backend.json \
            --of JSON \
            --sv 1.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Generate frontend SBOM from package.json / lockfile
        working-directory: frontend
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../sbom-artifacts/sbom-frontend.json

      - name: Upload CycloneDX SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: sbom-artifacts/
          if-no-files-found: error
