# M10 / Week 12 — optional k6 smoke against a running API (set BASE_URL secret).
name: M10 Load smoke (k6)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke
        env:
          BASE_URL: ${{ secrets.K6_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "K6_BASE_URL secret not set — skipping (configure in repo settings for real runs)."
            exit 0
          fi
          k6 run scripts/load/k6-smoke.js
