# M0 — optional synthetic uptime / health probe.
#
# Enable by adding repository secret:
#   UPTIME_PROBE_URL — full URL (e.g. https://api.example.com/api/health)
# Optional:
#   UPTIME_PROBE_BEARER_TOKEN — Bearer token if the URL requires auth (e.g. protected /metrics — prefer public /api/health)

name: API Uptime Probe

on:
  schedule:
    # Every 2 hours at :25 UTC (adjust cadence as needed)
    - cron: "25 */2 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    if: ${{ secrets.UPTIME_PROBE_URL != '' }}
    steps:
      - name: Probe URL
        env:
          URL: ${{ secrets.UPTIME_PROBE_URL }}
          TOKEN: ${{ secrets.UPTIME_PROBE_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          echo "Probing: ${URL}"
          # No -f: we need the status code even on 4xx/5xx for a clear error message.
          ARGS=( -sS --connect-timeout 15 --max-time 60 -o /tmp/probe_body.txt -w "%{http_code}" )
          if [ -n "${TOKEN:-}" ]; then
            ARGS+=( -H "Authorization: Bearer ${TOKEN}" )
          fi
          code="$(curl "${ARGS[@]}" "$URL")"
          echo "HTTP status: ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${code}"
            head -c 2000 /tmp/probe_body.txt || true
            exit 1
          fi
