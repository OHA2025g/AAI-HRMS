# Full stack: MongoDB + FastAPI + React (nginx)
#
# Fast rebuild (use layer cache — avoid --no-cache unless dependencies changed):
#   export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
#   docker compose up --build -d
#
# Demo seeds run once per Mongo volume; restarts skip them (see DEMO_SEEDS_FORCE in .env.example).
#
# UI:  http://localhost:3001 (host 3001 → nginx 80; change mapping if free)
# API (host port from API_HOST_PORT, default 8000): http://localhost:${API_HOST_PORT:-8000}/api/health
# Docs: http://localhost:${API_HOST_PORT:-8000}/docs
#
# QA login (after seed): qa_admin@aai-hrms.local / QA_Seed_ChangeMe!
#
# LCD50 demo: api entrypoint runs seed_employees_lifecycle_demo.py after QA seed.
# Inserts 50 employees on first run; on later runs re-syncs cross-module data without duplicating employees.
# Full wipe + re-seed: LCD50_SEED_REPLACE=1 docker compose up -d (or set in .env)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No host port — use `docker compose exec mongo mongosh` if needed (avoids clashes with local MongoDB)
    volumes:
      - aai_hrms_mongo_data:/data/db
    healthcheck:
      # Use explicit localhost + forced exit so the check never hangs.
      test:
        [
          "CMD-SHELL",
          "mongosh --host 127.0.0.1 --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 30s
      retries: 20
      start_period: 90s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aai_hrms
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      JWT_SECRET: ${JWT_SECRET:-docker_dev_jwt_change_me}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: "24"
      # Optional: set in .env next to this file (repo root — not backend/.env; that file is not used by Compose)
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      # LCD50 seed (see docker-entrypoint.sh): 1 = delete prior LCD50 demo rows and re-seed on this start
      LCD50_SEED_REPLACE: ${LCD50_SEED_REPLACE:-0}
      LCD50_SKIP_CROSS: ${LCD50_SKIP_CROSS:-0}
      LCD50_FORCE_CROSS_SYNC: ${LCD50_FORCE_CROSS_SYNC:-0}
      DEMO_SEEDS_FORCE: ${DEMO_SEEDS_FORCE:-0}
      SKIP_DEMO_SEEDS: ${SKIP_DEMO_SEEDS:-0}
      AUTO_IMPORT_EXCEL: ${AUTO_IMPORT_EXCEL:-1}
      CANDIDATES_EXCEL_PATH: ${CANDIDATES_EXCEL_PATH:-/data/excel/Candidates 1.xlsx}
      EXCEL_PATH: ${EXCEL_PATH:-/data/excel/Job Descriptions 1.xlsx}
    volumes:
      - ./Candidates 1.xlsx:/data/excel/Candidates 1.xlsx:ro
      - ./Job Descriptions 1.xlsx:/data/excel/Job Descriptions 1.xlsx:ro
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => SPA calls same-origin /api (nginx proxies to api:8000)
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  aai_hrms_mongo_data:
