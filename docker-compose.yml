# Full stack: MongoDB + FastAPI + React (nginx)
#
# Fast rebuild (use layer cache — avoid --no-cache unless dependencies changed):
#   export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
#   docker compose up --build -d
#
# Demo seeds run once per Mongo volume; restarts skip them (see DEMO_SEEDS_FORCE in .env.example).
#
# UI:  http://localhost:3001 (host 3001 → nginx 80; change mapping if free)
# API (host port from API_HOST_PORT, default 8000): http://localhost:${API_HOST_PORT:-8000}/api/health
# Docs: http://localhost:${API_HOST_PORT:-8000}/docs
#
# QA login (after seed): see QA_SEED_ADMIN_EMAIL / QA_SEED_ADMIN_PASSWORD in .env
#
# LCD50 demo: api entrypoint runs seed_employees_lifecycle_demo.py after QA seed.
# Inserts 50 employees on first run; on later runs re-syncs cross-module data without duplicating employees.
# Full wipe + re-seed: LCD50_SEED_REPLACE=1 docker compose up -d (or set in .env)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # No host port — use `docker compose exec mongo mongosh` if needed (avoids clashes with local MongoDB)
    volumes:
      - aai_hrms_mongo_data:/data/db
    healthcheck:
      # Use explicit localhost + forced exit so the check never hangs.
      test:
        [
          "CMD-SHELL",
          "mongosh --host 127.0.0.1 --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 30s
      retries: 20
      start_period: 90s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: aai_hrms
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      JWT_SECRET: ${JWT_SECRET:-docker_dev_jwt_change_me}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_HOURS: "24"
      QA_SEED_ADMIN_EMAIL: ${QA_SEED_ADMIN_EMAIL:-aghoreshwar@hotmail.com}
      QA_SEED_ADMIN_PASSWORD: ${QA_SEED_ADMIN_PASSWORD:-Prince@1804}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      # Optional: set in .env next to this file (repo root — not backend/.env; that file is not used by Compose)
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      # LCD50 seed (see docker-entrypoint.sh): 1 = delete prior LCD50 demo rows and re-seed on this start
      LCD50_SEED_REPLACE: ${LCD50_SEED_REPLACE:-0}
      LCD50_SKIP_CROSS: ${LCD50_SKIP_CROSS:-0}
      LCD50_FORCE_CROSS_SYNC: ${LCD50_FORCE_CROSS_SYNC:-0}
      DEMO_SEEDS_FORCE: ${DEMO_SEEDS_FORCE:-0}
      SKIP_DEMO_SEEDS: ${SKIP_DEMO_SEEDS:-0}
      SMART_HIRING_ONLY: ${SMART_HIRING_ONLY:-1}
      ALLOW_DB_FLUSH: ${ALLOW_DB_FLUSH:-1}
      AUTO_IMPORT_EXCEL: ${AUTO_IMPORT_EXCEL:-1}
      CANDIDATES_EXCEL_PATH: ${CANDIDATES_EXCEL_PATH:-/data/excel/Candidates 1.xlsx}
      EXCEL_PATH: ${EXCEL_PATH:-/data/excel/Job Descriptions 1.xlsx}
      CAREER_TRAJECTORY_AUTO_ANALYZE: ${CAREER_TRAJECTORY_AUTO_ANALYZE:-true}
      CAREER_TRAJECTORY_AUTO_PHASE2: ${CAREER_TRAJECTORY_AUTO_PHASE2:-true}
      CAREER_TRAJECTORY_ASYNC_ANALYZE: ${CAREER_TRAJECTORY_ASYNC_ANALYZE:-true}
      CAREER_TRAJECTORY_USE_SHAP: ${CAREER_TRAJECTORY_USE_SHAP:-1}
      CAREER_TRAJECTORY_ML_CALIBRATION: ${CAREER_TRAJECTORY_ML_CALIBRATION:-true}
      # Daily hiring dashboard snapshots for trend charts (see backend/docker-entrypoint.sh)
      HIRING_SNAPSHOT_TOKEN: ${HIRING_SNAPSHOT_TOKEN:-docker_dev_hiring_snapshot_token}
      HIRING_SNAPSHOT_ON_BOOT: ${HIRING_SNAPSHOT_ON_BOOT:-1}
    volumes:
      - ./Candidates 1.xlsx:/data/excel/Candidates 1.xlsx:ro
      - ./Job Descriptions 1.xlsx:/data/excel/Job Descriptions 1.xlsx:ro
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => SPA calls same-origin /api (nginx proxies to api:8000)
        REACT_APP_BACKEND_URL: ""
        REACT_APP_SMART_HIRING_ONLY: "1"
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy

  hiring-snapshot-cron:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HIRING_SNAPSHOT_TOKEN: ${HIRING_SNAPSHOT_TOKEN:-docker_dev_hiring_snapshot_token}
      HIRING_SNAPSHOT_INTERVAL_SECONDS: ${HIRING_SNAPSHOT_INTERVAL_SECONDS:-86400}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Hiring snapshot cron: interval $${HIRING_SNAPSHOT_INTERVAL_SECONDS}s"
        while true; do
          curl -sfS -X POST \
            -H "X-Hiring-Snapshot-Token: $${HIRING_SNAPSHOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://api:8000/api/admin/hiring-dashboard/snapshot-cron \
            || echo "Hiring snapshot cron warning (non-fatal)"
          sleep "$${HIRING_SNAPSHOT_INTERVAL_SECONDS}"
        done

  candidate-import-cleanup-cron:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CANDIDATE_IMPORT_CLEANUP_TOKEN: ${CANDIDATE_IMPORT_CLEANUP_TOKEN:-docker_dev_hiring_snapshot_token}
      CANDIDATE_IMPORT_CLEANUP_INTERVAL_SECONDS: ${CANDIDATE_IMPORT_CLEANUP_INTERVAL_SECONDS:-86400}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Candidate import cleanup cron: interval $${CANDIDATE_IMPORT_CLEANUP_INTERVAL_SECONDS}s"
        while true; do
          curl -sfS -X POST \
            -H "X-Candidate-Import-Cleanup-Token: $${CANDIDATE_IMPORT_CLEANUP_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://api:8000/api/ats/candidates/import/cleanup-cron \
            || echo "Candidate import cleanup cron warning (non-fatal)"
          sleep "$${CANDIDATE_IMPORT_CLEANUP_INTERVAL_SECONDS}"
        done

  linkedin-export-process-cron:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      LINKEDIN_EXPORT_PROCESS_TOKEN: ${LINKEDIN_EXPORT_PROCESS_TOKEN:-docker_dev_hiring_snapshot_token}
      LINKEDIN_EXPORT_PROCESS_INTERVAL_SECONDS: ${LINKEDIN_EXPORT_PROCESS_INTERVAL_SECONDS:-300}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "LinkedIn export process cron: interval $${LINKEDIN_EXPORT_PROCESS_INTERVAL_SECONDS}s"
        while true; do
          curl -sfS -X POST \
            -H "X-LinkedIn-Export-Process-Token: $${LINKEDIN_EXPORT_PROCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://api:8000/api/admin/linkedin/process-queue-cron \
            || echo "LinkedIn export process cron warning (non-fatal)"
          sleep "$${LINKEDIN_EXPORT_PROCESS_INTERVAL_SECONDS}"
        done

  apify-linkedin-process-cron:
    image: curlimages/curl:8.5.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APIFY_LINKEDIN_PROCESS_TOKEN: ${APIFY_LINKEDIN_PROCESS_TOKEN:-docker_dev_hiring_snapshot_token}
      APIFY_LINKEDIN_PROCESS_INTERVAL_SECONDS: ${APIFY_LINKEDIN_PROCESS_INTERVAL_SECONDS:-60}
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Apify LinkedIn process cron: interval $${APIFY_LINKEDIN_PROCESS_INTERVAL_SECONDS}s"
        while true; do
          curl -sfS -X POST \
            -H "X-Apify-LinkedIn-Process-Token: $${APIFY_LINKEDIN_PROCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            http://api:8000/api/admin/apify-linkedin/process-cron \
            || echo "Apify LinkedIn process cron warning (non-fatal)"
          sleep "$${APIFY_LINKEDIN_PROCESS_INTERVAL_SECONDS}"
        done

volumes:
  aai_hrms_mongo_data:
