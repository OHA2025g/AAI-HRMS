# Parsers for backend JSON logs (LOG_FORMAT=json).
# Fields: ts, service, request_id, level, logger, msg, optional exc
# If parsing time fails (microsecond precision), switch Time_Format or drop Time_Key.

[PARSER]
    Name        aai_json
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
