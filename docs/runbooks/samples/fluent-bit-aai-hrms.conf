# Fluent Bit sample — ship AAI-HRMS API logs when LOG_FORMAT=json (M0).
#
# Not a drop-in for every cluster: paths and parsers depend on your runtime
# (bare VM file, Docker, Kubernetes CRI). Adjust [INPUT] Path and parsers.
#
# Reference: https://docs.fluentbit.io/

[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers-aai-hrms.conf

# --- Example: tail a file written by your process supervisor ---
[INPUT]
    Name            tail
    Path            /var/log/aai-hrms/api.log
    Parser          aai_json
    Tag             aai.api
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On

# --- Example: forward to Loki (enable OUT loki plugin / use Grafana Agent) ---
# [OUTPUT]
#     Name            loki
#     Match           aai.api
#     Host            loki.example.com
#     Port            3100
#     Labels          job=aai-hrms-api,env=production

# --- Example: Elasticsearch ---
# [OUTPUT]
#     Name            es
#     Match           aai.api
#     Host            elasticsearch.example.com
#     Port            9200
#     Index           aai-hrms-logs
#     Type            _doc
