# Prometheus — scrape AAI-HRMS API (M0-3).
# For bearer token auth on /metrics, create a file with the raw token and set bearer_token_file below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: aai-hrms-api
    metrics_path: /metrics
    static_configs:
      # Docker Desktop: host.docker.internal. Linux: add extra_hosts host-gateway (see docker-compose).
      - targets: ["host.docker.internal:8001"]
    # Uncomment if PROMETHEUS_SCRAPE_TOKEN is set on the API:
    # authorization:
    #   type: Bearer
    #   credentials: "YOUR_TOKEN"
