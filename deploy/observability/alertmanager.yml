# Default: no external notifications (valid empty stack). Copy alertmanager.example-overrides.yml
# patterns into this file or mount a secret with Slack incoming webhook + PagerDuty routing key.
global:
  resolve_timeout: 5m

route:
  receiver: noop
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: noop
