# Prometheus alerting rules for AAI-HRMS API metrics (M0-3).
# Requires scrape job name `aai-hrms-api` and metrics:
#   aai_http_requests_total{method,status_class}
#   aai_http_request_duration_seconds_bucket (histogram)

groups:
  - name: aai-hrms-sre
    rules:
      - alert: AaiHrmsTargetDown
        expr: up{job="aai-hrms-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AAI-HRMS API scrape target is down"
          description: "Prometheus cannot scrape the API for more than 2 minutes."

      - alert: AaiHrmsHigh5xxRate
        expr: |
          sum(rate(aai_http_requests_total{status_class="5xx"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx HTTP rate on AAI-HRMS API"
          description: "5xx responses exceed 0.05 req/s (5m rate). Tune threshold for your traffic."

      - alert: AaiHrmsHigh5xxRatio
        expr: |
          (
            sum(rate(aai_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(aai_http_requests_total[5m])), 1e-6)
          ) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx ratio high on AAI-HRMS API"
          description: "More than 2% of requests are 5xx over 5m (requires sufficient total traffic)."

      - alert: AaiHrmsHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(aai_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on AAI-HRMS API"
          description: "95th percentile request duration exceeds 5s over 10m."

      # M3 — run POST /api/admin/workforce-intel/monitoring/evaluate to populate gauges.
      - alert: AaiM3ModelWorseThanHeuristic
        expr: |
          aai_m3_workforce_intel_model_beats_heuristic{job="aai-hrms-api"} == 0
          and
          aai_m3_workforce_intel_eval_skills_count{job="aai-hrms-api"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "M3 model MAE is not better than naive last-demand heuristic"
          description: "Run a fresh eval; investigate drift or retrain (see M3 monitoring API)."

      - alert: AaiM3HighMape
        expr: |
          aai_m3_workforce_intel_last_mape_pct{job="aai-hrms-api"} > 40
          and
          aai_m3_workforce_intel_eval_skills_count{job="aai-hrms-api"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "M3 workforce intel MAPE above policy threshold"
          description: "Check WORKFORCE_INTEL_MAPE_RETRAIN_THRESHOLD_PCT and last evaluation."
