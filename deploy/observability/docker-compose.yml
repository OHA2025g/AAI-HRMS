# Local observability stack: Prometheus + Grafana (M0-3).
#
# Prereq: API running on host port 8001 with GET /metrics exposed.
#
#   cd backend && uvicorn server:app --host 0.0.0.0 --port 8001
#
# Start stack:
#   cd deploy/observability && docker compose up -d
#
# Grafana: http://localhost:3001  (admin / admin — change on first login)
# Prometheus: http://localhost:9090
# Alertmanager: http://localhost:9093
#
# Linux: host.docker.internal may need:
#   echo 'extra_hosts:\n  - "host.docker.internal:host-gateway"' >> override
# or set targets to your host IP in prometheus.yml.

services:
  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
