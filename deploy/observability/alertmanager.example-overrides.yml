# FRAGMENT — merge these keys into alertmanager.yml (replace the simple `route` / `receivers`
# block) once you have secrets. This file is not valid Alertmanager config on its own.
# Slack: create Incoming Webhook, paste URL below.
# PagerDuty: Events API v2 integration key.

route:
  receiver: team
  routes:
    - matchers:
        - severity="critical"
      receiver: pagerduty
      continue: true
    - matchers:
        - severity=~"warning|critical"
      receiver: slack

receivers:
  - name: team
  - name: slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/T000/B000/REPLACE"
        channel: "#aai-hrms-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: pagerduty
    pagerduty_configs:
      - routing_key: "REPLACE_PAGERDUTY_INTEGRATION_KEY"
        send_resolved: true
        description: "{{ .CommonAnnotations.description }}"
