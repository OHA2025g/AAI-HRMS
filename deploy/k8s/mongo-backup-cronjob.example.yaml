# Example: MongoDB logical backup to S3-compatible storage (Week 12 / M0 remaining).
# Build a tiny image: mongo tools + aws-cli (or use your distroless pattern). Wire secrets via Secret or IRSA.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aai-hrms-mongo-backup
  namespace: default
spec:
  schedule: "15 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: your-registry/aai-hrms-mongo-backup:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT=/tmp/dump-$TS
                  mongodump --uri="$MONGO_URI" --out="$OUT"
                  tar -czf /tmp/backup-$TS.tgz -C /tmp "dump-$TS"
                  aws s3 cp /tmp/backup-$TS.tgz "s3://$S3_BUCKET/aai-hrms/$TS.tgz"
              envFrom:
                - secretRef:
                    name: mongo-backup-secrets
